name: AntiGravity CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Run Database Initialization
      run: |
        echo "Initializing test database..."
        python backend/init_db.py

    - name: Run Agent Core Unit Tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        echo "Pip environment:"
        pip freeze
        echo "Running 14+ unit tests with verbose logging..."
        python -c "import sys; print('PYTHONPATH:', sys.path)"
        # Use python to run tests directly so we can catch import errors natively if discover fails
        python -m unittest discover -s agent_core -v -p "test_*.py" || (echo "UNITTEST FAILED" && exit 1)

    - name: Verify Archivist (Agent 06) Execution
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        echo "Verifying headless data sync pipeline..."
        python automation/agent_06_archivist.py

    - name: Verify End-to-End Orchestrator Pipeline
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        echo "Verifying Multi-Agent Integration..."
        python automation/orchestrator.py
